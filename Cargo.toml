[package]
name = "buffy"
version = "0.1.0"
edition = "2021"
description = "Buffy CLI Automation Framework"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
sha2 = "0.10"
thiserror = "1"
anyhow = "1"
dirs = "5"
colored = "2"
chrono = "0.4"
glob = "0.3"
indicatif = "0.17"
regex-lite = "0.1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 2
strip = true
lto = true
